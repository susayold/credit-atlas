[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-atlas"
version = "0.1.0"
description = "CreditAtlas: reproducible credit research workspaces, starting with residential mortgage lifecycle"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.5", "pyarrow==22.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "playwright==1.56.0"]
models = ["scikit-learn==1.8.0"]
structured = ["xlrd==2.0.2"]
simulation = ["numpy==2.5.3", "scipy==1.18.1"]

[project.scripts]
credit-atlas = "credit_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor/credit_risk_strategy_lab/src", "vendor/credit_risk_strategy_lab"]
addopts = "-ra"
